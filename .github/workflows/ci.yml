name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup WinApp CLI
      uses: microsoft/setup-WinAppCli@v0.2

    - name: Create the app package
      run: winapp pack AuraClick\AuraClick.csproj -c Debug --arch x86 --arch x64 --arch arm64 --output AuraClick.msixbundle

    - name: Upload MSIX package
      uses: actions/upload-artifact@v7
      with:
        name: MSIX Package
        path: AuraClick.msixbundle
        if-no-files-found: error

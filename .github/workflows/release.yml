name: Create Release

on:
  push:
    tags:
      - v*.*.*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  store:
    runs-on: windows-latest

    env:
      Solution_Name: AuraClick.slnx
      Configuration: Release
      Bundle_Platforms: x86|x64|ARM64
      Appx_Package_Dir: Packages\

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3

    - name: Restore the application
      run: msbuild $env:Solution_Name /t:Restore /p:Configuration=$env:Configuration

    - name: Create Store package
      run: >
        msbuild $env:Solution_Name
        /p:Configuration=$env:Configuration
        /p:Platform=x64
        /p:AppxBundlePlatforms="$env:Bundle_Platforms"
        /p:AppxBundle=Always
        /p:UapAppxPackageBuildMode=StoreUpload
        /p:AppxPackageDir="$env:Appx_Package_Dir"
        /p:AppxPackageSigningEnabled=false
        /p:GenerateAppxPackageOnBuild=true

    - name: Setup Microsoft Store Developer CLI
      uses: microsoft/microsoft-store-apppublisher@v1.4

    - name: Reconfigure store credentials
      run: >
        msstore reconfigure
        --tenantId "$env:Tenant_Id"
        --sellerId "$env:Seller_Id"
        --clientId "$env:Client_Id"
        --clientSecret "$env:Client_Secret"
      env:
        Tenant_Id: ${{ secrets.AZURE_AD_TENANT_ID }}
        Seller_Id: ${{ secrets.SELLER_ID }}
        Client_Id: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
        Client_Secret: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}

    - name: Publish to Store
      run: msstore publish (Resolve-Path "AuraClick\$env:Appx_Package_Dir*.msixupload").Path -id 9NTVRZD0MF7F

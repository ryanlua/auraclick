name: Create Release

on:
  push:
    tags:
      - v*.*.*.*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  store:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup WinApp CLI
      uses: microsoft/setup-WinAppCli@v0.2

    - name: Create Store package
      run: winapp pack AuraClick\AuraClick.csproj --arch x86 --arch x64 --arch arm64 --output AuraClick.msixbundle

    - name: Upload Store package
      uses: actions/upload-artifact@v7
      with:
        name: Store Package
        path: AuraClick.msixbundle
        if-no-files-found: error

    - name: Configure Store credentials
      run: >
        winapp store reconfigure
        --tenantId '${{ secrets.AZURE_AD_TENANT_ID }}'
        --sellerId '${{ secrets.SELLER_ID }}'
        --clientId '${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}'
        --clientSecret '${{ secrets.AZURE_AD_APPLICATION_SECRET }}'

    - name: Publish to Store
      run: winapp store publish AuraClick.msixbundle --appId 9NTVRZD0MF7F

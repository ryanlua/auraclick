name: Create Release

on:
  push:
    tags:
      - v*.*.*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  store:
    runs-on: windows-latest

    env:
      Solution_Name: AuraClick.slnx
      Configuration: Release
      Bundle_Platforms: x86|x64|ARM64
      Appx_Package_Dir: Packages\

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3

    - name: Restore the application
      run: msbuild $env:Solution_Name /t:Restore /p:Configuration=$env:Configuration

    - name: Create Store package
      run: >
        msbuild $env:Solution_Name
        /p:Configuration=$env:Configuration
        /p:Platform=x64
        /p:AppxBundlePlatforms="$env:Bundle_Platforms"
        /p:AppxBundle=Always
        /p:UapAppxPackageBuildMode=StoreUpload
        /p:AppxPackageDir="$env:Appx_Package_Dir"
        /p:AppxPackageSigningEnabled=false
        /p:GenerateAppxPackageOnBuild=true

    - name: Setup Microsoft Store Developer CLI
      uses: microsoft/microsoft-store-apppublisher@v1.4

    - name: Reconfigure store credentials 
      run: msstore reconfigure ` 
            --tenantId ${{ secrets.AZURE_AD_TENANT_ID }} ` 
            --sellerId ${{ secrets.SELLER_ID }} ` 
            --clientId ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }} ` 
            --clientSecret ${{ secrets.AZURE_AD_APPLICATION_SECRET }} 
 
    - name: Publish to Store 
      run: msstore publish '${{ github.workspace }}/release/package.msix' -id 9NTVRZD0MF7F
